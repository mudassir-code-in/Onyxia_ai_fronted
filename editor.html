<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catch the Star</title>
  <style>
    body { margin:0; overflow:hidden; background:#0a0a2a; color:#fff; font-family:sans-serif; }
    #score { position:absolute; top:10px; left:10px; font-size:1.2rem; }
    #star {
      position:absolute; width:40px; height:40px;
      background:url('https://i.imgur.com/6XK4ZkU.png') no-repeat center/contain;
      cursor:pointer;
    }
    #ground { position:absolute; bottom:0; left:0; right:0; height:30px; background:#222; }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <div id="star"></div>
  <div id="ground"></div>

  <script>
    const star = document.getElementById('star');
    const scoreEl = document.getElementById('score');
    let score = 0;
    let falling = false;

    function resetStar() {
      // random horizontal position
      star.style.left = Math.random() * (window.innerWidth - 40) + 'px';
      star.style.top = '-50px';
      falling = true;
    }

    function gameOver() {
      alert('Game over! Your score: ' + score);
      score = 0;
      scoreEl.textContent = 'Score: 0';
      resetStar();
    }

    // move the star down each frame
    function animate() {
      if (falling) {
        let top = parseFloat(star.style.top);
        top += 4; // speed
        star.style.top = top + 'px';

        // reached ground?
        if (top > window.innerHeight - 70) {
          falling = false;
          gameOver();
        }
      }
      requestAnimationFrame(animate);
    }

    // click handler
    star.addEventListener('click', () => {
      if (!falling) return;
      score++;
      scoreEl.textContent = 'Score: ' + score;
      falling = false;
      setTimeout(resetStar, 300); // short pause before next star
    });

    // start
    resetStar();
    animate();
  </script>
</body>
</html>
